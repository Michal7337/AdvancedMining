# Sets if the block breaking progress bar should be shown
show-progress-bar: true

# Sets the color of the mining progress bar
# Possible colors: blue, red, pink, green, yellow, purple, white
progress-bar-color: blue

# Sets if normal vanilla blocks can be broken with default vanilla mechanics
break-vanilla-blocks: true

# Sets the range at which the block cracking animation will be shown to other players
cracking-animation-range: 50

# Sets if the player can stop mining the current block and start mining other blocks without loosing progress on previously mined blocks
allow-breaking-multiple-blocks: true

# Sets how many blocks players can be mining simultaneously
# Set to 1 if you just want the player to be able to stop mining a block and start again without loosing progress
simultaneous-broken-blocks-limit: 1

# Sets the amount of ticks after which progress on a previously mined block is reset
mining-progress-reset-timer: 1200

# Sets if the player should be able to resume mining a block with a different tool to what they originally used to mine it
# Note that this will use the new tool's stats from that point onwards
allow-tool-swapping: false

# Configures the behavior of enchantments on tools
enchantments:

  # Configures the efficiency enchantment
  efficiency:

    # Sets if the enchantment should have any effect
    enable: false

    # Sets what kind of effect this enchantment should have. Possible options are:
    # constant - Adds the specified amount of mining speed to the tool per level of efficiency. E.g. efficiency 1 - +100 MS | 2 - +200 MS
    # percent - Increases the tool's mining speed by the specified percentage per level of efficiency. E.g. efficiency 1 - +10% MS | 2 - +20% MS
    effect-type: constant

    # Sets the amount of given mining speed. For constant, just set the amount added per level. For percent, set it to E.g. 0.1 for 10%, 0.35 for 35% or 1.5 for 150%
    amount: 100.0

  fortune:

    # Sets if the enchantment should have any effect. You can set a block drop to ignore fortune using the command
    enable: false

    # Sets what kind of effect this enchantment should have. Possible options are:
    # vanilla - attempts to mimic vanilla fortune behavior, which you can read more about on the Minecraft Wiki
    # custom - applies the options below to block drops. Each option applies to all individual drops a block has
    effect-type: vanilla

    # Increases the minimum item drop amount by the specified amount per level of fortune
    increase-min-amount: 1

    # Increases the maximum item drop amount by the specified amount per level of fortune
    increase-max-amount: 1

    # Increases the item drop chance by the specified amount per level of fortune
    increase-drop-chance: 0.1

    # Increases the amount of times drops are rolled on a block by the specified amount per level of fortune
    increase-drop-rolls: 0

    # Sets how the vanilla option behaves. Possible options:
    # additional-rolls - will roll the drop multiple times. Useful if you want players to be able to roll for rare drops multiple times
    # increase-max-drop-amount - will just increase the max amount of items that can drop
    vanilla-behaviour: additional-rolls

    # Sets if the vanilla fortune behavior should trigger even when the tool has silk touch on it
    vanilla-ignore-silk-touch: false

effects:

  haste:

    # Sets if the potion should have any effect
    enable: false

    # Sets what kind of effect this potion should have. Possible options are:
    # constant - Adds the specified amount of mining speed to the tool per level of haste. E.g. haste 1 - +100 MS | 2 - +200 MS
    # percent - Increases the tool's mining speed by the specified percentage per level of haste. E.g. haste 1 - +10% MS | 2 - +20% MS
    effect-type: constant

    # Sets the amount of given mining speed. For constant, just set the amount added per level. For percent, set it to E.g. 0.1 for 10%, 0.35 for 35% or 1.5 for 150%
    amount: 100.0

  mining-fatigue:

    # Sets if the potion should have any effect
    enable: false

    # Sets what kind of effect this potion should have. Possible options are:
    # constant - Subtracts the specified amount of mining speed to the tool per level of mining fatigue. E.g. mining fatigue 1 - +100 MS | 2 - +200 MS
    # percent - Decreases the tool's mining speed by the specified percentage per level of mining fatigue. E.g. mining fatigue 1 - +10% MS | 2 - +20% MS
    effect-type: constant

    # Sets the amount of subtracted mining speed. For constant, just set the amount subtracted per level. For percent, set it to E.g. 0.1 for 10%, 0.35 for 35% or 1.5 for 150%
    amount: 100.0

# Sets the behavior of the drop chance bonus. Possible options are:
# multiply - multiplies the base chance by 1 + bonus (so if the chance is 10% (0.1) and bonus is 20% (0.2) the result is 12% (0.12)
# add - directly adds the bonus to the base (so base 10% and bonus 20% results in 30%)
drop-chance-bonus-behavior: multiply

# Enables the Mining Fortune stat mechanic. It functions like in Hypixel Skyblock.
# Meaning that every 'mining-fortune-bonus-divisor' Mining Fortune a Player has, the drops get multiplied by that amount and any extra fortune is a chance to multiply another one time.
# This means that if the Min and Max drop amount is 1, it will multiply that 1. If the Min amount is 1 and Max is 4, it first rolls between that and then multiplies it.
# If the divisor is 100 and the player has 140 Mining Fortune, the multiplier will be 1 and 40% for another 1. At 230, it will be 2 and 30% for 3.
# The calculation formula is just MiningFortune / FortuneDivisor where the whole number is the MinAmount increase and the decimal is the chance at another drop.
# The AffectedByFortune and SilkTouchOnly drop properties are respected
# Note: The multiplier is applied to drops after normal fortune calculations
enable-mining-fortune: false

# Sets every how much Mining Fortune you get a guaranteed drop amount increase
mining-fortune-bonus-divisor: 100

# Sets how much Mining Fortune you get per level of the Fortune enchantment
mining-fortune-per-fortune-level: 40
